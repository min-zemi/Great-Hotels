{% extends "hotels/base.html" %}

{% block title %}Hotel Search{% endblock %}

{% block content %}

<h2>Search Hotels</h2>

<form method="get">
    {{ form.as_p }}

    <button type="submit">
        Search
    </button>
</form>

{% if search_data %}

<h3>Entered Information</h3>

<p>City: {{ search_data.city }}</p>

<p>Room Type: {{ search_data.room_type }}</p>

<p>Date: {{ search_data.date }}</p>

{% endif %}

{% endblock %}
