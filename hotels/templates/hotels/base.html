<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Great Hotels{% endblock %}</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header>
        <h1>Great Hotels</h1>

        <nav aria-label="Main navigation">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'hotel_search' %}">Search Hotels</a>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 Great Hotels</p>
    </footer>
</body>
</html>
