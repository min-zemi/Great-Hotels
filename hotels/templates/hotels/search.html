
{% extends "hotels/base.html" %}

{% block title %}Hotel Search{% endblock %}

{% block content %}

<h2>Search Hotels</h2>

<form
    hx-get="{% url 'hotel_search_results' %}"
    hx-target="#search-results"
    hx-swap="innerHTML"
    hx-indicator="#loading-message"
>
    {{ form.as_p }}

    <button type="submit">
        Search
    </button>
</form>

<p id="loading-message" class="htmx-indicator">
    Searching...
</p>

<section
    id="search-results"
    aria-live="polite"
>
    <p>Search results will appear here.</p>
</section>

{% endblock %}
