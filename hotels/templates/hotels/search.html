<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hotel Search</title>
</head>
<body>
    <h1>Search Hotels</h1>

    <form method="get">
        {{ form.as_p }}
        <button type="submit">Search</button>
    </form>

    {% if search_data %}
        <h2>Entered information</h2>

        <p>City: {{ search_data.city }}</p>
        <p>Room type: {{ search_data.room_type }}</p>
        <p>Check-in date: {{ search_data.check_in_date }}</p>
    {% endif %}
</body>
</html>
